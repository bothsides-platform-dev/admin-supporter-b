[Service]
EnvironmentFile=/etc/alloy/observability.env
Environment=GOMEMLIMIT=192MiB
ExecStart=
ExecStart=/usr/bin/alloy run --storage.path=/var/lib/alloy --server.http.listen-addr=127.0.0.1:12345 /etc/alloy/observability
User=alloy
Group=alloy
MemoryHigh=256M
MemoryMax=384M
CPUQuota=50%
Restart=on-failure
RestartSec=5s
