name: Verify and promote

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: python3 -m unittest discover -s scripts/deploy/tests
      - run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
          AUTH_SECRET: ci-only-build-fixture-01234567890123456789
          AUTH_URL: https://admin.support-b.com
          NEXT_PUBLIC_BASE_URL: https://admin.support-b.com
          PUBLIC_APP_URL: https://support-b.com
          NEXT_TELEMETRY_DISABLED: '1'
      - run: pnpm typecheck

  promote:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish the verified main commit
        shell: bash
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            git push origin "$GITHUB_SHA:refs/heads/deploy/production"
          fi
